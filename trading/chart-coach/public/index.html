<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chart Coach</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #21262d;
    --text: #c9d1d9; --dim: #8b949e;
    --green: #2ea043; --red: #da3633; --blue: #316dca; --maroon: #8b2f4b; --amber: #d29922;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 420px; margin: 0 auto; padding: 12px; }
  header { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  header h1 { font-size: 16px; flex: 1; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  #dot.on { background: var(--green); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--dim); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; animation: pop .25s ease; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }
  .card.BUY { border-left-color: var(--green); }
  .card.SELL { border-left-color: var(--red); }
  .card.EXITL { border-left-color: var(--blue); }
  .card.EXITS { border-left-color: var(--maroon); }
  .card.UNK { border-left-color: var(--amber); }
  .card .head { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .card .time { color: var(--dim); font-weight: 400; font-size: 12px; }
  .card .why { color: var(--dim); font-size: 13px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 10px; }
  footer { color: var(--dim); font-size: 11px; text-align: center; padding: 14px 0; }
</style>
</head>
<body>
<header>
  <div id="dot" title="connection"></div>
  <h1>Chart Coach <span style="color:var(--dim);font-size:12px">v0</span></h1>
  <button id="notifyBtn">🔔 Enable alerts</button>
  <button id="testBtn">Test</button>
</header>
<div id="feed"><div class="empty">Waiting for signals from TradingView…<br/>POST to <code>/webhook</code></div></div>
<footer>Educational tool — signals narrate the bot, they are not trade advice.</footer>
<script>
  const feed = document.getElementById("feed");
  const dot = document.getElementById("dot");
  let empty = true;

  function cls(ev) {
    if (ev.startsWith("BUY")) return "BUY";
    if (ev.startsWith("SELL")) return "SELL";
    if (ev === "EXIT LONG") return "EXITL";
    if (ev === "EXIT SHORT") return "EXITS";
    return "UNK";
  }
  function icon(ev) {
    return ev.startsWith("BUY") ? "🟢" : ev.startsWith("SELL") ? "🔴" : ev.startsWith("EXIT") ? "🏁" : "⚠️";
  }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.06;
      o.start(); o.stop(ctx.currentTime + 0.18);
    } catch {}
  }
  function add(ev, silent) {
    if (empty) { feed.innerHTML = ""; empty = false; }
    const d = document.createElement("div");
    d.className = "card " + cls(ev.event);
    const t = new Date(ev.ts).toLocaleTimeString();
    d.innerHTML =
      '<div class="head"><span>' + icon(ev.event) + " " + ev.event + " — " + (ev.symbol || "?") +
      '</span><span class="time">' + t + '</span></div><div class="why">' + ev.explanation + "</div>";
    feed.prepend(d);
    while (feed.children.length > 60) feed.lastChild.remove();
    if (!silent) {
      beep();
      if (Notification.permission === "granted")
        new Notification("Chart Coach: " + ev.event + " " + (ev.symbol || ""), { body: ev.explanation.slice(0, 140) + "…" });
    }
  }

  let seeded = false;
  function connect() {
    const es = new EventSource("/events");
    es.onopen = () => { dot.classList.add("on"); };
    es.onerror = () => { dot.classList.remove("on"); es.close(); setTimeout(connect, 2000); };
    let backlog = !seeded;
    let backlogTimer = null;
    es.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      add(ev, backlog);            // replayed history is silent; live events beep
      clearTimeout(backlogTimer);
      backlogTimer = setTimeout(() => { backlog = false; seeded = true; }, 400);
    };
  }
  connect();

  document.getElementById("notifyBtn").onclick = () => Notification.requestPermission();
  document.getElementById("testBtn").onclick = () =>
    fetch("/webhook", { method: "POST", body: JSON.stringify({ event: "BUY ENTRY", symbol: "US100 (test)" }) });
</script>
</body>
</html>
