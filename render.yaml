# Render.com Blueprint. Point Render at this repo, choose "New → Blueprint",
# and it provisions the database + web + worker in one click.
databases:
  - name: cardtrackers-db
    databaseName: cards
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cardtrackers-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardtrackers-db
          property: connectionString
      - key: MOCK_MODE
        value: "true"
      - key: NODE_ENV
        value: production

  - type: worker
    name: cardtrackers-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "node_modules/.bin/tsx scripts/scheduler.ts"
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardtrackers-db
          property: connectionString
      - key: MOCK_MODE
        value: "true"
      - key: NODE_ENV
        value: production
      - key: REFRESH_INTERVAL_MS
        value: "600000"
