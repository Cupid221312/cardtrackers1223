# Local production-parity stack: Postgres + web + scheduler in the same image.
# Verify a full deploy end-to-end without touching a cloud provider:
#   docker compose up --build
#   open http://localhost:3000     (dashboard)
#   curl http://localhost:3000/api/health

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: cards
      POSTGRES_DB: cards
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cards -d cards"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cards:cards@db:5432/cards?connection_limit=20&pool_timeout=20
      MOCK_MODE: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    # Push schema then start the web server. In real prod use `prisma migrate deploy`
    # against a proper migration history — this compose is for local parity testing.
    command:
      - sh
      - -c
      - "npx --yes prisma db push --schema=prisma/schema.postgres.prisma --accept-data-loss && node server.js"

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cards:cards@db:5432/cards?connection_limit=10&pool_timeout=20
      MOCK_MODE: "true"
      NODE_ENV: production
      REFRESH_INTERVAL_MS: "600000"
    # Separate process from the web server so a long scrape can't starve HTTP.
    command: ["node_modules/.bin/tsx", "scripts/scheduler.ts"]

volumes:
  dbdata:
